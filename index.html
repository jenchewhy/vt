<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRS Voting Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .title {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }
        .card {
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .card-white {
            background: #1e293b;
            border: 2px solid white;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .card-dead {
            background: #1e293b;
            border: 2px solid #ef4444;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1.125rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-green {
            background: #22c55e;
            color: white;
        }
        .btn-green:hover:not(:disabled) {
            background: #16a34a;
        }
        .btn-red {
            background: #ef4444;
            color: white;
        }
        .btn-red:hover {
            background: #dc2626;
        }
        .btn-gray {
            background: #475569;
            color: white;
        }
        .btn-gray:hover {
            background: #334155;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            max-width: 100%;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            max-width: 100%;
        }
        .player-tile {
            background: #334155;
            border: 2px solid #475569;
            border-radius: 1rem;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            transform: scale(0.95);
            min-height: 160px;
            position: relative;
        }
        .player-tile.add-player {
            background: transparent;
            border: 2px dashed #475569;
            min-height: 160px;
            max-height: 160px;
            height: 160px;
        }
        .player-tile.add-player:hover:not(:disabled) {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
            transform: scale(1.00);
        }
        .player-tile.dead {
            opacity: 0.4;
            cursor: not-allowed;
            background: #1e293b;
            border-color: #ef4444;
        }
        .player-tile.dead:hover {
            transform: scale(0.95);
            background: #1e293b;
        }
        .delete-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            width: 2rem;
            height: 2rem;
            background: #ef4444;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.125rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 100;
            line-height: 1;
            padding: 0;
            margin: 0;
            flex-shrink: 0;
        }
        .delete-btn:hover {
            background: #dc2626;
        }
        .add-icon {
            font-size: 4rem;
            color: #475569;
            font-weight: 300;
            line-height: 1;
        }
        .player-tile.add-player:hover .add-icon {
            color: #22c55e;
        }
        .player-tile:hover:not(:disabled):not(.dead) {
            transform: scale(1.00);
            background: #475569;
        }
        .player-tile:disabled:not(.dead) {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .player-tile.selected {
            background: #22c55e;
            border-color: #22c55e;
        }
        .player-tile.disabled-vote {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .player-number {
            font-size: 4.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 1rem;
        }
        .player-badge {
            background: #22c55e;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .player-badge.white {
            background: white;
            color: #22c55e;
        }
        .player-badge.red {
            background: #ef4444;
            color: white;
        }
        .timer {
            background: #ef4444;
            color: white;
            text-align: center;
            padding: 1rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            font-size: 1.5rem;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .subtitle {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-align: center;
            margin-bottom: 1rem;
        }
        .text-white {
            color: white;
        }
        .text-gray {
            color: #94a3b8;
        }
        .text-red {
            color: #ef4444;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .vote-result {
            background: #334155;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .vote-result.top {
            border: 4px solid #ef4444;
        }
        .voter-avatar {
            width: 5rem;
            height: 5rem;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
        }
        .voter-chip {
            background: #475569;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .vote-count {
            background: #0f172a;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .flex-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .dead-skull {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            font-size: 2rem;
        }
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            .player-number {
                font-size: 3rem;
                margin-bottom: 0.75rem;
            }
            .grid-results {
                grid-template-columns: 1fr;
            }
            .grid-2 {
                gap: 0.75rem;
            }
            .grid-3 {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
            .player-tile {
                min-height: 140px;
                padding: 1rem 0.75rem;
            }
            .container {
                padding: 1rem;
            }
        }
        @media (min-width: 769px) {
            .grid-2 {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .grid-results {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        .no-results {
            text-align: center;
            color: #94a3b8;
            font-size: 1.25rem;
            padding: 5rem 0;
        }
        .connection-status {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: #22c55e;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            z-index: 1000;
        }
        .connection-status.disconnected {
            background: #ef4444;
        }
    </style>
</head>

        const STORAGE_KEY_PLAYER = 'lrs_voting_player_number';

        // Load saved player number on page load
        function loadSavedPlayerNumber() {
            const savedPlayer = localStorage.getItem(STORAGE_KEY_PLAYER);
            if (savedPlayer) {
                const playerNum = parseInt(savedPlayer);
                // Check if this player number is still valid and available
                const selectedPlayers = Array.isArray(gameState.selectedPlayers) ? gameState.selectedPlayers : [];
                if (playerNum >= 1 && playerNum <= gameState.totalPlayers && selectedPlayers.includes(playerNum)) {
                    myPlayerNumber = playerNum;
                    console.log('Restored player number:', myPlayerNumber);
                } else {
                    // Clear invalid saved data
                    localStorage.removeItem(STORAGE_KEY_PLAYER);
                }
            }
        }

        // Save player number to localStorage
        function savePlayerNumber(num) {
            localStorage.setItem(STORAGE_KEY_PLAYER, num.toString());
        }

        // Clear saved player number
        function clearSavedPlayerNumber() {
            localStorage.removeItem(STORAGE_KEY_PLAYER);
        }

        // Check if player is dead
        function isPlayerDead(playerNum) {
            const deadPlayers = Array.isArray(gameState.deadPlayers) ? gameState.deadPlayers : [];
            return deadPlayers.includes(playerNum);
        }

        // Connection status monitoring
        const connectedRef = ref(db, '.info/connected');
        onValue(connectedRef, (snapshot) => {
            isConnected = snapshot.val() === true;
            updateConnectionStatus();
        });

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connectionStatus');
            if (isConnected) {
                statusEl.textContent = '🟢 Connected';
                statusEl.classList.remove('disconnected');
            } else {
                statusEl.textContent = '🔴 Disconnected';
                statusEl.classList.add('disconnected');
            }
